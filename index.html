<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAA 스터디 상황판</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#DFE7E9; --surface:#FFFFFF; --surface2:#EFF4F5; --line:#C3D2D5; --lineSoft:#DCE5E7;
  --ink:#0F1A1D; --ink2:#3C4C50; --muted:#63767B;
  --accent:#0E7C86; --accentInk:#FFFFFF; --accentSoft:#E0F0F1;
  --ok:#2E8B5B; --okSoft:#E4F3EA;
  --late:#B0730A; --lateSoft:#FAEFD6;
  --exc:#54679A; --excSoft:#E9EDF6;
  --abs:#C0433C; --absSoft:#FAE5E3;
  --sick:#A8547A; --sickSoft:#F8E7EE;
  --off:#8FA0A4; --offSoft:#ECF1F2;
  --reg:#8A5AA8; --regSoft:#F2E9F7;
  --shadow:0 1px 1px rgba(15,26,29,.04),0 3px 8px -3px rgba(15,26,29,.14),0 14px 32px -18px rgba(15,26,29,.35);
  --radius:14px;
  color-scheme:light;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,monospace;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.55;
  -webkit-font-smoothing:antialiased;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1360px;margin:0 auto;padding:0 22px 64px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand span{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.tabs{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{padding:6px 14px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tools{display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 13px;font-size:13.5px;
  font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.save{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.42;cursor:default}
.btn:disabled:hover{border-color:var(--line)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden}
.card-h{padding:12px 18px;background:var(--surface2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);
  display:flex;align-items:center;gap:8px}
.card-h h2::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent)}
.card-h .rest{margin-left:auto;font-size:12.5px;color:var(--muted)}

.grid-main{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
@media (max-width:1000px){.grid-main{grid-template-columns:1fr}}

.today{padding:22px 24px 24px}
.eyebrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;font-family:var(--mono);
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow .live{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:p 2.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 var(--accentSoft)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.dline{display:flex;align-items:flex-end;gap:14px;margin-top:8px;flex-wrap:wrap}
.dbig{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.dnav{display:flex;gap:4px;margin-left:auto}
.dnav button{border:1px solid var(--line);border-radius:8px;width:32px;height:32px;font-size:13px;color:var(--muted)}
.dnav button:hover{border-color:var(--accent);color:var(--ink)}
.dnav .wide{width:auto;padding:0 11px}
.topic{margin:14px 0 0;font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.35;text-wrap:balance}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{font-size:12px;padding:3.5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.chip.hi{background:var(--accentSoft);border-color:transparent;color:var(--accent);font-weight:600}
.chip.warn{background:var(--lateSoft);border-color:transparent;color:var(--late);font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:10px;margin-top:20px}
.tile{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--surface2);
  display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--off)}
.tile[data-s="present"]::before{background:var(--ok)}
.tile[data-s="late"]::before{background:var(--late)}
.tile[data-s="excused"]::before{background:var(--exc)}
.tile[data-s="absent"]::before{background:var(--abs)}
.tile[data-s="sick"]::before{background:var(--sick)}
.tile[data-s="none"]::before{background:var(--line)}
.tile.regday{border-color:var(--reg)}
.t-name{display:flex;align-items:baseline;gap:6px;font-weight:600;font-size:15px;letter-spacing:-.01em;flex-wrap:wrap}
.t-name em{font-style:normal;font-size:11px;color:var(--muted);font-family:var(--mono)}
.t-lead{font-size:10px;font-weight:600;color:var(--accent);border:1px solid var(--accent);
  border-radius:4px;padding:0 4px;letter-spacing:.04em}
.regtag{font-size:11px;background:var(--regSoft);color:var(--reg);border-radius:5px;padding:2px 6px;
  font-weight:600;line-height:1.4}
.regtag span{font-weight:400;opacity:.85}
.pill{align-self:flex-start;font-size:12px;font-weight:600;padding:2.5px 9px;border-radius:999px;
  background:var(--offSoft);color:var(--off)}
.pill[data-s="present"]{background:var(--okSoft);color:var(--ok)}
.pill[data-s="late"]{background:var(--lateSoft);color:var(--late)}
.pill[data-s="excused"]{background:var(--excSoft);color:var(--exc)}
.pill[data-s="absent"]{background:var(--absSoft);color:var(--abs)}
.pill[data-s="sick"]{background:var(--sickSoft);color:var(--sick)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.seg button{border:1px solid var(--line);border-radius:7px;padding:5px 0;font-size:12px;font-weight:500;
  color:var(--muted);background:var(--surface)}
.seg button:hover{border-color:var(--ink2);color:var(--ink)}
.seg button[aria-pressed="true"]{color:#fff;border-color:transparent}
.seg button[data-v="present"][aria-pressed="true"]{background:var(--ok)}
.seg button[data-v="late"][aria-pressed="true"]{background:var(--late)}
.seg button[data-v="excused"][aria-pressed="true"]{background:var(--exc)}
.seg button[data-v="absent"][aria-pressed="true"]{background:var(--abs)}
.seg button[data-v="sick"][aria-pressed="true"]{background:var(--sick)}
.memo{font-size:12.5px;color:var(--ink2);line-height:1.45;border-left:2px solid var(--line);padding-left:8px}
.memo.empty{color:var(--muted);font-style:italic}
.memo-in,.f{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;
  background:var(--surface);color:var(--ink)}
.memo-in:focus,.f:focus{border-color:var(--accent);outline:none}
.quick{display:flex;gap:4px;flex-wrap:wrap}
.quick button{font-size:11px;border:1px dashed var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.quick button:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
.tally{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--lineSoft)}
.tally div{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.tally b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);font-size:15px}

.rail{display:flex;flex-direction:column;gap:20px}
.nlist{padding:8px 14px 14px;display:flex;flex-direction:column;gap:8px}
.nitem{border:1px solid var(--line);border-radius:10px;background:var(--surface2);overflow:hidden}
.nitem summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:9px}
.nitem summary::-webkit-details-marker{display:none}
.nitem summary:hover{background:var(--surface)}
.ntag{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;white-space:nowrap}
.ntag.out{background:var(--absSoft);color:var(--abs)}
.ntag.in{background:var(--okSoft);color:var(--ok)}
.ntag.soon{background:var(--accentSoft);color:var(--accent)}
.ntag.reg{background:var(--regSoft);color:var(--reg)}
.ntag.warn{background:var(--lateSoft);color:var(--late)}
.nname{font-weight:600;font-size:14.5px}
.nname em{font-style:normal;font-size:11px;color:var(--muted);font-family:var(--mono);margin-left:4px}
.ndate{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.ncaret{color:var(--muted);font-size:11px;transition:transform .18s}
.nitem[open] .ncaret{transform:rotate(90deg)}
.nbody{padding:0 12px 12px;font-size:13px;color:var(--ink2);line-height:1.6}
.nbody .lb{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-family:var(--mono);display:block;margin-bottom:3px}
.empty-note{padding:16px 14px;font-size:13px;color:var(--muted);text-align:center;line-height:1.6}

.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
@media (max-width:1000px){.goals{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}}
.goal{background:var(--surface);padding:14px 16px}
.goal .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.goal .v{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:3px;font-family:var(--mono);
  font-variant-numeric:tabular-nums}
.goal .v small{font-size:12px;font-weight:500;color:var(--muted);font-family:var(--sans);letter-spacing:0}
.goal .sub{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:5px;border-radius:99px;background:var(--lineSoft);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.mission{padding:15px 18px;font-size:14px;color:var(--ink2);line-height:1.6;border-bottom:1px solid var(--lineSoft)}
.mission b{color:var(--ink);font-weight:600}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--lineSoft);white-space:nowrap}
thead th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;
  font-family:var(--mono);background:var(--surface2);position:sticky;top:0;z-index:2}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2)}
td.nm{font-weight:600;position:sticky;left:0;background:var(--surface);z-index:1}
tbody tr:hover td.nm{background:var(--surface2)}
thead th.nm{left:0;z-index:3}
.dw{font-weight:400;letter-spacing:0;display:block}
.mk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;
  font-size:12px;font-weight:700;font-family:var(--mono)}
.mk[data-s="present"]{background:var(--okSoft);color:var(--ok)}
.mk[data-s="late"]{background:var(--lateSoft);color:var(--late)}
.mk[data-s="excused"]{background:var(--excSoft);color:var(--exc)}
.mk[data-s="absent"]{background:var(--absSoft);color:var(--abs)}
.mk[data-s="sick"]{background:var(--sickSoft);color:var(--sick)}
.mk[data-s="none"]{background:transparent;color:var(--line);border:1px dashed var(--line)}
.mk[data-s="off"]{background:transparent;color:var(--off)}
.mk.has{cursor:pointer;position:relative}
.mk.has::after{content:"";position:absolute;right:1px;top:1px;width:5px;height:5px;border-radius:50%;background:currentColor}
.mk.regd{box-shadow:0 0 0 1.5px var(--reg)}
.mk.sm{width:22px;height:22px;font-size:11px;border-radius:6px}
.mk.sm[data-s="none"]{color:var(--off);border-color:var(--off)}
.legend span{color:var(--ink2)}
td.dcol{text-align:center;padding:6px}
.alerts{padding:13px 18px;display:flex;flex-wrap:wrap;gap:7px;border-top:1px solid var(--lineSoft);align-items:center}
.alerts .lb{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);margin-right:4px}
.alert{font-size:12.5px;padding:3px 10px;border-radius:999px;font-weight:500}
.alert.late{background:var(--lateSoft);color:var(--late)}
.alert.absent{background:var(--absSoft);color:var(--abs)}
.alert.excused{background:var(--excSoft);color:var(--exc)}
.alert.sick{background:var(--sickSoft);color:var(--sick)}
.alert.clean{background:var(--okSoft);color:var(--ok)}
.alert.reg{background:var(--regSoft);color:var(--reg)}

.sec{margin-top:20px}
.sched-day{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
tr.is-off td{color:var(--muted)}
tr.is-today td{background:var(--accentSoft)}
tr.is-today td.nm{background:var(--accentSoft)}
tr.is-today td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.moved td:first-child{box-shadow:inset 3px 0 0 var(--reg)}
.stage td{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-family:var(--mono);font-weight:600;padding:10px 12px;background:var(--surface2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 18px;font-size:12.5px;color:var(--muted);
  border-top:1px solid var(--lineSoft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.rate{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.rate.low{color:var(--abs)}
.rate.mid{color:var(--late)}
.rate.hi{color:var(--ok)}
.hm{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:29px;border-radius:8px;
  font-family:var(--mono);font-weight:700;font-size:14px;border:1px solid transparent;
  background:var(--surface2);color:var(--ink)}
.hm[data-lv="0"]{background:transparent;color:var(--off);font-weight:400;font-size:13px}
.hm[data-lv="1"]{background:var(--surface2);color:var(--ink);border-color:var(--line)}
.hm[data-lv="2"]{background:var(--lateSoft);color:var(--late);border-color:var(--late)}
.hm[data-lv="3"]{background:var(--absSoft);color:var(--abs);border-color:var(--abs)}
.hm sup{font-size:10.5px;font-weight:700;color:var(--late);margin-left:3px;line-height:1}
.hm sub{font-size:10.5px;font-weight:700;color:var(--sick);margin-left:3px;vertical-align:super;line-height:1}
table.dowt th+th,table.dowt td+td{border-left:1px solid var(--lineSoft)}
table.dowt td,table.dowt th{border-bottom-color:var(--line)}
table.dowt td.dcol{padding:7px 6px}
.hint{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.hint b{font-family:var(--mono);font-weight:700}

.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-top:1px dashed var(--line)}
.frow label{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.dowpick{display:flex;gap:4px}
.dowpick button{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--muted)}
.dowpick button[aria-pressed="true"]{background:var(--reg);border-color:var(--reg);color:#fff;font-weight:600}
.editrow td{background:var(--surface2)}
.editgrid{display:flex;gap:8px;flex-wrap:wrap;align-items:center;white-space:normal}
.editgrid .f{width:auto}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);z-index:99;max-width:88vw;text-align:center}
footer{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}

.sync{width:9px;height:9px;border-radius:50%;background:var(--off);display:inline-block;flex:none}
.sync[data-st="live"]{background:var(--ok)}
.sync[data-st="saving"]{background:var(--late)}
.sync[data-st="offline"]{background:var(--abs)}
.sync[data-st="noconf"]{background:var(--abs)}

.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;padding:14px 18px}
.team{border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:11px;background:var(--surface2);
  padding:11px 12px;display:flex;flex-direction:column;gap:9px}
.team-h{display:flex;align-items:center;gap:8px}
.team-h b{font-size:15px;letter-spacing:-.01em}
.team-n{font-size:12px;color:var(--muted);font-family:var(--mono);margin-left:auto}
.team-name{width:auto;flex:1;font-weight:600;padding:4px 8px}
.chips2{display:flex;flex-wrap:wrap;gap:5px}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.mchip button{color:var(--muted);font-size:14px;line-height:1}
.mchip button:hover{color:var(--abs)}
.muted-s{font-size:12.5px;color:var(--muted)}
.assign{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);
  border-radius:9px;padding:4px 9px}
.assign b{font-size:12.5px;font-weight:600;white-space:nowrap}
.assign select{width:auto;padding:3px 6px;font-size:12.5px}
.lb2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.tf{align-items:center}
.tpick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tpick button{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;
  color:var(--muted);background:var(--surface)}
.tpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:600}
.rbadge{font-size:11px;font-weight:700;background:var(--lateSoft);color:var(--late);border-radius:5px;padding:2px 8px}
.tres{padding:14px 18px;border-top:1px solid var(--lineSoft)}
.tres-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tres-h b{font-size:14.5px}
.qgrid{display:flex;flex-wrap:wrap;gap:4px}
.q{width:36px;height:31px;border:1px solid var(--line);border-radius:7px;font-family:var(--mono);
  font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--surface);font-variant-numeric:tabular-nums}
.q:hover{border-color:var(--ink2)}
.q.wrong{background:var(--absSoft);border-color:var(--abs);color:var(--abs)}

function dowStats(){
  var out={};
  S.members.forEach(function(m){out[m.id]={};WEEKDAYS.forEach(function(n){out[m.id][n]={miss:0,late:0,sick:0};});});
  var t=todayISO();
  SCHED.forEach(function(e){
    if(e.k==="off"||e.d>t) return;
    var n=dnum(e.d); if(WEEKDAYS.indexOf(n)<0) return;
    S.members.forEach(function(m){
      if(!isMember(m,e.d)) return;
      var s=stat(e.d,m.id);
      if(isMiss(s)) out[m.id][n].miss++;
      else if(s==="late") out[m.id][n].late++;
      else if(s==="sick") out[m.id][n].sick++;
    });
  });
  return out;
}

  var ds=dowStats(), out=[];
  S.members.forEach(function(m){
    WEEKDAYS.forEach(function(n){
      var c=ds[m.id][n];
      if(c.miss>=2 && (!m.regDays||m.regDays.indexOf(n)<0)) out.push({m:m,dow:n,cnt:c.miss});
    });
  });
  return out.sort(function(a,b){return b.cnt-a.cnt;});
}

function goalCard(){
  var t=todayISO();
  var dExam=daysBetween(t,S.meta.examFrom);
  var lect=SCHED.filter(function(e){return e.k==="lecture";});
  var lectDone=lect.filter(function(e){return e.d<=t;}).length;
  var sess=SCHED.filter(function(e){return e.k!=="off";});
  var doneAll=sess.filter(function(e){return e.d<=t;}).length;
  var tot=0,ok=0;
  weekDates(cur).forEach(function(d){
    var e=byDate(d); if(!e||e.k==="off"||d>t) return;
    activeOn(d).forEach(function(m){
      var s=stat(d,m.id); if(!counted(s))return; tot++; if(s==="present"||s==="late")ok++;});
  });
  var wkRate=tot?Math.round(ok/tot*100):null;
  var pLect=Math.round(lectDone/lect.length*100), pAll=Math.round(doneAll/sess.length*100);
  return '<section class="card"><div class="card-h"><h2>스터디 목표</h2></div>'
   +'<div class="mission"><b>전원 합격.</b> '+esc(S.meta.mission)+'</div>'
   +'<div class="goals">'
     +'<div class="goal"><div class="k">시험 응시</div><div class="v">'+(dExam>0?"D-"+dExam:(dExam===0?"D-DAY":"응시 기간"))+'</div>'
       +'<div class="sub">10/1 ~ 10/8 개별 응시</div></div>'
     +'<div class="goal"><div class="k">강의 완강</div><div class="v">'+lectDone+'<small> / '+lect.length+'일</small></div>'
       +'<div class="bar"><i style="width:'+pLect+'%"></i></div></div>'
     +'<div class="goal"><div class="k">전체 일정</div><div class="v">'+pAll+'<small>%</small></div>'
       +'<div class="bar"><i style="width:'+pAll+'%"></i></div></div>'
     +'<div class="goal"><div class="k">이번 주 출석률</div><div class="v">'+(wkRate===null?"–":wkRate+'<small>%</small>')+'</div>'
       +'<div class="sub">'+(wkRate===null?"기록 없음":"지각 포함 참석 기준")+'</div></div>'
   +'</div></section>';
}

function weekCard(){
  var dates=weekDates(cur), e=byDate(cur);
  var ms=S.members.filter(function(m){return dates.some(function(d){return isMember(m,d);});});
  var h='<section class="card sec"><div class="card-h"><h2>이번 주 출결 — '+esc(e.w)+'</h2>'
    +'<span class="rest">'+fmtShort(dates[0])+' ~ '+fmtShort(dates[dates.length-1])+'</span></div>';
  h+='<div class="scroll"><table><thead><tr><th class="nm">인원</th>'
    +dates.map(function(d){var s=byDate(d);
      return '<th style="text-align:center">'+fmtShort(d)+'<span class="dw">'
        +(s.k==="off"?"휴무":dowOf(d))+'</span></th>';}).join("")
    +'<th style="text-align:center">주간</th></tr></thead><tbody>';
  ms.forEach(function(m){
    var tot=0,ok=0;
    var cells=dates.map(function(d){
      var s=byDate(d);
      if(s.k==="off") return '<td class="dcol"><span class="mk" data-s="off" title="휴무">–</span></td>';
      if(!isMember(m,d)) return '<td class="dcol"><span class="mk" data-s="off" title="미소속">·</span></td>';
      var v=stat(d,m.id), mo=memo(d,m.id), reg=isRegDay(m,d);
      if(counted(v)){tot++; if(v==="present"||v==="late")ok++;}
      return '<td class="dcol"><span class="mk'+(mo?" has":"")+(reg?" regd":"")+'" data-s="'+v+'"'
        +(mo?' title="'+esc(ST[v].ko)+' — '+esc(mo)+'" data-act="peek" data-txt="'+esc(m.name)+' · '+fmtShort(d)+' '+esc(ST[v].ko)+': '+esc(mo)+'"'
            :' title="'+esc(ST[v].ko)+(reg?" · 정기 불참 요일":"")+'"')
        +'>'+ST[v].short+'</span></td>';
    }).join("");
    var r=tot?Math.round(ok/tot*100):null;
    h+='<tr><td class="nm">'+esc(m.name)
      +(m.tag?' <span style="font-weight:400;color:var(--muted);font-size:11.5px">'+esc(m.tag)+'</span>':"")
      +'</td>'+cells
      +'<td class="dcol"><span class="rate '+rateClass(r)+'">'+(r===null?"–":r+"%")+'</span></td></tr>';
  });
  h+='</tbody></table></div>';
  var flags=[];
  dates.forEach(function(d){
    var s=byDate(d); if(s.k==="off") return;
    activeOn(d).forEach(function(m){
      var v=stat(d,m.id);
      if(v!=="none"&&v!=="present") flags.push({m:m,d:d,v:v,memo:memo(d,m.id),reg:isRegDay(m,d)});
    });
  });
  h+='<div class="alerts"><span class="lb">이번 주 특이사항</span>';
  if(!flags.length){ h+='<span class="alert clean">지각 · 결석 없음</span>'; }
  else{
    flags.forEach(function(f){
      h+='<span class="alert '+(f.v==="sick"?"sick":(f.reg?"reg":f.v))+'">'+esc(f.m.name)+(f.m.tag?"("+esc(f.m.tag)+")":"")
        +' · '+fmtShort(f.d)+'('+dowOf(f.d)+') '+ST[f.v].ko+(f.reg&&f.v!=="sick"?" · 정기":"")
        +' — '+(f.memo?esc(f.memo):"사유 미기재")+'</span>';
    });
  }
  return h+'</div></section>';
}

    h+=attTable()+dowTable()+schedTable();
  }

    +(readOnly?'<br>보기 전용 화면입니다. 출결 입력은 조장 화면에서 이루어집니다.':'')+'</footer></div>';

document.addEventListener("click",function(ev){
  var el;
  if((el=ev.target.closest("[data-page]"))){page=el.getAttribute("data-page");editRow=null;render();window.scrollTo(0,0);return;}
  if((el=ev.target.closest("[data-nav]"))){var d=el.getAttribute("data-nav");if(d){cur=d;render();}return;}
  if(ev.target.closest("#editBtn")){editMode=!editMode;editRow=null;render();return;}

function saveRow(d){
  var base=null;
  BASE.forEach(function(e){if(e.d===d)base=e;});
  var t=document.getElementById("edT").value.trim();
  var hh=document.getElementById("edH").value.trim();
  var n=document.getElementById("edN").value.trim();
  var off=document.getElementById("edOff").checked;
  var o={};
  if(t!==base.t) o.t=t;
  if(hh!==(base.h||"")) o.h=hh;
  if(n!==(base.n||"")) o.n=n;
  var k=off?"off":(base.k==="off"?"lecture":base.k);
  if(k!==base.k) o.k=k;
  if(Object.keys(o).length) S.over[d]=o; else delete S.over[d];
  SCHED=applyOver(); editRow=null; mark("sched:"+d); render();
}

function pushNext(d){
  var i=idx(d), nx=null;
  for(var j=i+1;j<SCHED.length;j++){ if(SCHED[j].k!=="off"){nx=SCHED[j];break;} }
  if(!nx){toast("이월할 다음 회차가 없습니다.");return;}
  var e=byDate(d);
  var o=S.over[nx.d]||{};
  o.t=e.t+" · "+nx.t;
  o.h=(e.h?e.h+" + ":"")+(nx.h||"");
  o.n=[e.n,nx.n].filter(Boolean).join(" / ");
  S.over[nx.d]=o;
  S.over[d]={k:"off",t:"일정 없음 (다음 회차로 이월)",h:"",n:"이월"};
  SCHED=applyOver(); editRow=null; mark("sched:"+d); mark("sched:"+nx.d); render();
  toast(fmtShort(d)+" 내용을 "+fmtShort(nx.d)+"로 이월했습니다.");
}

/* ================= 과제 ================= */
function taskById(id){ for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id===id) return S.tasks[i]; return null; }
function parseNums(str){
  var out=[], seen={};
  String(str||"").split(/[,\s]+/).forEach(function(tok){
    if(!tok) return;
    var m=tok.match(/^(\d+)[-~](\d+)$/);
    if(m){
      var a=+m[1], b=+m[2]; if(a>b){ var t=a; a=b; b=t; }
      if(b-a>300) b=a+300;
      for(var i=a;i<=b;i++) if(!seen[i]){ seen[i]=1; out.push(String(i)); }
    }else if(/^\d+$/.test(tok)){
      if(!seen[tok]){ seen[tok]=1; out.push(tok); }
    }
  });
  return out.sort(function(x,y){ return (+x)-(+y); });
}
function dayOpts(sel){
  return SCHED.filter(function(e){ return e.k!=="off"; }).map(function(e){
    return '<option value="'+e.d+'"'+(e.d===sel?" selected":"")+'>'+fmtShort(e.d)+' ('+dowOf(e.d)+')</option>';
  }).join("");
}
function targetsOf(t){
  return (t.teamIds.length? t.teamIds.map(teamById) : S.teams.slice()).filter(Boolean);
}
function resOf(t,gid){
  if(!t.res[gid]) t.res[gid]={wrong:[],who:{},note:""};
  return t.res[gid];
}

function addTask(){
  if(!S.teams.length){ toast("팀을 먼저 만들어 주세요."); return; }
  var nums=parseNums(document.getElementById("tkNums").value);
  if(!nums.length){ toast("문제 번호를 입력하세요. 예: 1-40"); return; }
  var ids=[];
  [].forEach.call(document.querySelectorAll('#tkTeams [data-act="tkteam"]'),function(b){
    if(b.getAttribute("aria-pressed")==="true") ids.push(b.getAttribute("data-id"));
  });
  if(!ids.length){ toast("대상 팀을 하나 이상 고르세요."); return; }
  var title=document.getElementById("tkTitle").value.trim();
  S.seqT=(S.seqT||0)+1;
  var t={ id:"k"+S.seqT,
          title: title || ("문제 "+nums[0]+"~"+nums[nums.length-1]),
          src: document.getElementById("tkSrc").value.trim(),
          date: document.getElementById("tkDate").value,
          due: document.getElementById("tkDue").value,
          nums: nums, teamIds: ids, parent:"", round:1, res:{} };
  ids.forEach(function(g){ t.res[g]={wrong:[],who:{},note:""}; });
  S.tasks.push(t);
  taskForm=false; mark("task:"+t.id); render();
  toast("과제를 출제했습니다. 저장하기를 눌러 전원에게 반영하세요.");
}
function delTask(id){
  var t=taskById(id); if(!t) return;
  S.tasks=S.tasks.filter(function(x){return x.id!==id;});
  mark("task:"+id); render();
  toast("“"+t.title+"” 과제를 삭제했습니다.");
}
function qtog(tid,gid,n){
  var t=taskById(tid); if(!t) return;
  var r=resOf(t,gid), i=r.wrong.indexOf(n);
  if(i>=0){ r.wrong.splice(i,1); delete r.who[n]; }
  else { r.wrong.push(n); r.wrong.sort(function(a,b){return (+a)-(+b);}); }
  mark("res:"+tid+":"+gid); render();
}
function setWho(tid,gid,n,mid){
  var t=taskById(tid); if(!t) return;
  var r=resOf(t,gid);
  if(mid) r.who[n]=mid; else delete r.who[n];
  mark("res:"+tid+":"+gid); syncSaveBtn();
}
function retry(tid,gid){
  var t=taskById(tid); if(!t) return;
  var gs = gid ? [gid] : targetsOf(t).map(function(g){return g.id;});
  var union=[], seen={};
  gs.forEach(function(g){
    var r=t.res[g]; if(!r) return;
    r.wrong.forEach(function(n){ if(!seen[n]){ seen[n]=1; union.push(n); } });
  });
  if(!union.length){ toast("재출제할 오답이 없습니다."); return; }
  union.sort(function(a,b){ return (+a)-(+b); });
  S.seqT=(S.seqT||0)+1;
  var round=(t.round||1)+1;
  var gname = gid ? (teamById(gid)?teamById(gid).name:"") : "";
  var nt={ id:"k"+S.seqT, title:t.title+" — "+round+"차 오답"+(gname?" ("+gname+")":""), src:t.src,
           date:cur, due:"", nums:union, teamIds:gs, parent:t.id, round:round, res:{} };
  gs.forEach(function(g){ nt.res[g]={wrong:[],who:{},note:""}; });
  S.tasks.push(nt);
  mark("task:"+nt.id); render(); window.scrollTo(0,0);
  toast(union.length+"문제로 "+round+"차 오답 과제를 만들었습니다.");
}

        h+='<div class="allok">'+(t.nums.length?"오답 없음":"문제 없음")+'</div>';
      }else{
        h+='<div class="chips2">'+wrong.map(function(n){
          return '<span class="qchip">'+n+(who[n]?'<em>'+esc(mName(who[n]))+'</em>':'<em class="undec">담당 미정</em>')+'</span>';
        }).join("")+'</div>';
      }
    }
    h+='</div>';
  });
  if(editMode&&!readOnly){
    var any=targets.some(function(g){ var r=t.res[g.id]; return r&&r.wrong&&r.wrong.length; });
    if(any) h+='<div class="frow"><button class="btn" data-act="retryall" data-t="'+t.id+'">전체 팀 오답 모아 재출제</button>'
      +'<span class="muted-s">팀별 오답을 합쳐 새 과제를 만듭니다</span></div>';
  }
  return h+'</section>';
}

function taskSection(){
  var h='<section class="card sec"><div class="card-h"><h2>과제 · 문제 풀이</h2>'
    +'<span class="rest">'+S.tasks.length+'건 출제됨</span>'
    +(editMode&&!readOnly?'<button class="btn sm" id="newTask">'+(taskForm?"닫기":"+ 과제 출제")+'</button>':"")+'</div>';
  if(editMode&&!readOnly&&taskForm) h+=taskFormHTML();
  if(!S.tasks.length){
    h+='<div class="empty-note">출제된 과제가 없습니다.<br>'
      +(editMode&&!readOnly?'“+ 과제 출제”로 문제 범위와 대상 팀을 정하세요.'
                           :'편집을 켜면 과제를 출제할 수 있습니다.')+'</div>';
  }
  h+='</section>';
  S.tasks.slice().sort(function(a,b){
    return (b.date||"").localeCompare(a.date||"") || ((+b.id.slice(1))-(+a.id.slice(1)));
  }).forEach(function(t){ h+=taskCard(t); });
  return h;
}

function todayTaskCard(){
  var list=S.tasks.filter(function(t){ return t.date===cur || t.due===cur; });
  if(!list.length) return "";
  var h='<section class="card"><div class="card-h"><h2>오늘의 과제</h2>'
    +'<span class="rest">'+fmtShort(cur)+'</span></div><div class="nlist">';
  list.forEach(function(t){
    var targets=targetsOf(t);
    var wrong=0; targets.forEach(function(g){ var r=t.res[g.id]; if(r&&r.wrong) wrong+=r.wrong.length; });
    h+='<div class="nitem" data-act="gotask" style="cursor:pointer"><div style="padding:10px 12px">'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
      +'<span class="ntag '+(t.due===cur?"warn":"soon")+'">'+(t.due===cur?"마감":"출제")+'</span>'
      +'<span class="nname">'+esc(t.title)+'</span></div>'
      +'<div class="muted-s" style="margin-top:5px">'+t.nums.length+'문제 · '
      +targets.map(function(g){return esc(g.name);}).join(", ")
      +(wrong?' · <span style="color:var(--abs)">오답 '+wrong+'</span>':"")+'</div>'
      +'</div></div>';
  });
  return h+'</div></section>';
}

/* ---------- Firebase 연동 ---------- */
var db=null, auth=null, user=null, authReady=false, needSeed=false;
var syncSt="init", docRef=null;

function syncTitle(){
  return ({init:"연결 중…", live:"실시간 연결됨 — 저장하면 모두에게 즉시 반영",
           saving:"저장 중…", offline:"연결이 끊겼습니다",
           noconf:"Firebase 설정이 필요합니다 (README 참고)"})[syncSt] || "";
}
function authBtn(){
  if(syncSt==="noconf") return "";
  if(!authReady) return "";
  return user
    ? '<button class="btn sm" id="outBtn" title="'+esc(user.email||"")+'">로그아웃</button>'
    : '<button class="btn sm" id="inBtn">조장 로그인</button>';
}
function signIn(){
  if(!auth) return;
  signInWithPopup(auth, new GoogleAuthProvider()).catch(function(e){
    toast("로그인하지 못했습니다: "+(e&&e.code?e.code:""), 6000);
  });
}
function signOutNow(){ if(auth) signOut(auth); }

function seedUpload(){
  if(!db||!user){ toast("조장 계정으로 로그인해야 합니다."); return; }
  syncSt="saving"; render();
  setDoc(docRef, {json:JSON.stringify(S), at:Date.now(), by:(user.email||"")})
    .then(function(){ needSeed=false; syncSt="live"; render(); toast("초기 데이터를 올렸습니다."); })
    .catch(function(e){ syncSt="offline"; render(); toast("올리지 못했습니다: "+(e&&e.code?e.code:""), 6000); });
}

function save(){
  if(syncSt==="noconf"){ toast("Firebase 설정이 아직 없습니다.", 6000); return; }
  if(!db||!user){ toast("조장 계정으로 로그인해야 저장할 수 있습니다."); return; }
  var btn=document.getElementById("saveBtn");
  if(btn){ btn.disabled=true; btn.textContent="저장 중…"; }
  syncSt="saving";
  setDoc(docRef, {json:JSON.stringify(S), at:Date.now(), by:(user.email||"")})
    .then(function(){
      dirty=false; changes={}; syncSt="live"; render();
      toast("저장했습니다. 보고 있는 사람 화면에 바로 반영됩니다.");
    })
    .catch(function(err){
      syncSt="offline"; dirty=true; render();
      var c=err&&err.code;
      if(c==="permission-denied") toast("저장 권한이 없습니다. 규칙에 등록된 계정으로 로그인했는지 확인해 주세요.", 7000);
      else toast("저장하지 못했습니다: "+(c||"알 수 없는 오류"), 7000);
    });
}

function initFirebase(){
  var ok = FIREBASE_CONFIG && FIREBASE_CONFIG.projectId
        && String(FIREBASE_CONFIG.apiKey||"").indexOf("여기에")<0;
  if(!ok){
    syncSt="noconf"; readOnly=true; render();
    toast("Firebase 설정을 index.html 맨 위에 붙여넣어야 저장·공유가 켜집니다. 지금은 보기 전용입니다.", 9000);
    return;
  }
  var app0 = initializeApp(FIREBASE_CONFIG);
  db = getFirestore(app0);
  auth = getAuth(app0);
  docRef = doc(db, "board", "state");

  onAuthStateChanged(auth, function(u){
    user=u; authReady=true; readOnly=!u;
    if(!u){ editMode=false; }
    render();
  });

  onSnapshot(docRef, function(snap){
    syncSt="live";
    if(!snap.exists()){ needSeed=true; render(); return; }
    needSeed=false;
    if(dirty){ render(); return; }          /* 저장 안 한 로컬 변경은 덮어쓰지 않음 */
    var d=snap.data();
    if(d && typeof d.json==="string"){
      try{ S=JSON.parse(d.json); normalize(); SCHED=applyOver();
           if(idx(cur)<0) cur=pickDefaultDate(); }catch(e){}
    }
    render();
  }, function(){ syncSt="offline"; render(); });
}

restoreUI();
render();
initFirebase();
})();
</script>
